name: Kernels

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: bakasu-${{ github.workflow_ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.codename }} BakaSU kernel
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - codename: rosemary
            defconfig: rosemary_defconfig
            repo: https://github.com/LineageOS/android_kernel_xiaomi_mt6785.git
            branch: "lineage-23.2"
    env:
      DEVICE_CODENAME: ${{ matrix.codename }}
      DEFCONFIG: ${{ matrix.defconfig }}
      KERNEL_REPO: ${{ matrix.repo }}
      KERNEL_BRANCH: ${{ matrix.branch }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPRESS: "1"
      CCACHE_SLOPPINESS: include_file_mtime,include_file_ctime

    steps:
      - name: Set build info
        shell: bash
        run: |
          set -euo pipefail
          BUILD_DATE="$(date -u +%Y%m%d)"
          KERNEL_NAME="${DEVICE_CODENAME}-Baka"
          {
            echo "BUILD_DATE=${BUILD_DATE}"
            echo "KERNEL_NAME=${KERNEL_NAME}"
            echo "ZIP_NAME=${DEVICE_CODENAME}-BakaSU-${BUILD_DATE}.zip"
            echo "KBUILD_BUILD_USER=${KERNEL_NAME}"
            echo "KBUILD_BUILD_HOST=${BUILD_DATE}"
            echo "JOBS=$(( $(nproc --all) * 2 ))"
          } >> "$GITHUB_ENV"
          echo "Kernel name : ${KERNEL_NAME}"
          echo "Output zip  : ${DEVICE_CODENAME}-BakaSU-${BUILD_DATE}.zip"
          echo "Runner      : $(nproc --all) vCPU / $(free -g | awk '/^Mem:/ {print $2}') GB RAM"

      - name: Restore ccache
        id: ccache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ env.DEVICE_CODENAME }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-${{ env.DEVICE_CODENAME }}-

      - name: Install dependencies and download sources (parallel)
        shell: bash
        run: |
          set -euo pipefail

          install_deps() {
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
              bc bison build-essential ccache cpio curl device-tree-compiler dwarves flex git \
              libelf-dev liblz4-tool libncurses-dev libssl-dev python3 python-is-python3 \
              rsync unzip zip zlib1g-dev \
              gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
              gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi
          }
          clone_kernel() {
            git clone -q --depth=1 --no-tags --single-branch --branch "$KERNEL_BRANCH" \
              "$KERNEL_REPO" kernel-source
            git -C kernel-source log -1 --oneline
          }
          clone_toolchain() {
            git clone -q --depth=1 --no-tags \
              https://github.com/kdrag0n/proton-clang.git clang-toolchain
          }
          clone_anykernel() {
            git clone -q --depth=1 --no-tags https://github.com/osm0sis/AnyKernel3.git anykernel3
            rm -rf anykernel3/.git
          }

          PIDS=()
          NAMES=()
          start() {
            local name="$1"
            shift
            ( "$@" 2>&1 | sed -u "s/^/[${name}] /" ) &
            PIDS+=("$!")
            NAMES+=("$name")
          }

          start deps      install_deps
          start kernel    clone_kernel
          start toolchain clone_toolchain
          start anykernel clone_anykernel

          failed=0
          for i in "${!PIDS[@]}"; do
            if ! wait "${PIDS[$i]}"; then
              echo "::error::Failed: ${NAMES[$i]}"
              failed=1
            fi
          done
          [ "$failed" -eq 0 ] || exit 1

          test -f kernel-source/Makefile
          if [ ! -f "kernel-source/arch/arm64/configs/${DEFCONFIG}" ]; then
            echo "::error::${DEFCONFIG} not found in ${KERNEL_REPO} (${KERNEL_BRANCH})"
            exit 1
          fi

      - name: Set up LLVM toolchain
        shell: bash
        run: |
          set -euo pipefail
          CLANG_BIN="$GITHUB_WORKSPACE/clang-toolchain/bin"
          for tool in clang ld.lld llvm-nm llvm-ar llvm-objcopy llvm-objdump llvm-strip; do
            if [ ! -x "$CLANG_BIN/$tool" ]; then
              echo "::error::Required LLVM tool is missing: $tool"
              exit 1
            fi
          done
          TOOLCHAIN_SHA="$(git -C clang-toolchain rev-parse HEAD)"
          echo "$CLANG_BIN" >> "$GITHUB_PATH"
          {
            echo "CLANG_BIN=$CLANG_BIN"
            echo "CCACHE_COMPILERCHECK=string:${TOOLCHAIN_SHA}"
          } >> "$GITHUB_ENV"
          "$CLANG_BIN/clang" --version | sed -n '1p'
          "$CLANG_BIN/ld.lld" --version

      - name: Integrate root component
        shell: bash
        working-directory: kernel-source
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 2 \
            https://raw.githubusercontent.com/Baka-SU/BakaSU/main/kernel/setup.sh \
            -o /tmp/root-setup.sh
          bash /tmp/root-setup.sh
          test -L drivers/kernelsu
          test -f KernelSU/kernel/Kconfig
          echo "Root component integrated."

      - name: Apply manual hooks
        shell: bash
        working-directory: kernel-source
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding="utf-8", errors="surrogateescape")

          def write(path, text):
              Path(path).write_text(text, encoding="utf-8", errors="surrogateescape")

          def insert_before(path, anchor, block, marker):
              text = read(path)
              if marker in text:
                  print(f"Already present: {path}: {marker}")
                  return
              count = text.count(anchor)
              if count != 1:
                  raise SystemExit(
                      f"{path}: expected one anchor for {marker}; found {count}."
                  )
              write(path, text.replace(anchor, block + anchor, 1))
              print(f"Added: {path}: {marker}")

          def patch_function(path, signature, anchor, block, marker,
                             optional=False, replace=False):
              text = read(path)
              match = re.search(signature, text, re.S)
              if not match:
                  if optional:
                      print(f"Optional function absent: {path}: {marker}")
                      return
                  raise SystemExit(f"{path}: function not found for {marker}")
              opening = match.end() - 1
              if text[opening] != "{":
                  raise SystemExit(f"{path}: invalid function boundary: {marker}")
              depth = 0
              closing = None
              for pos in range(opening, len(text)):
                  if text[pos] == "{":
                      depth += 1
                  elif text[pos] == "}":
                      depth -= 1
                      if depth == 0:
                          closing = pos
                          break
              if closing is None:
                  raise SystemExit(f"{path}: unmatched braces: {marker}")
              body_start = opening + 1
              body = text[body_start:closing]
              if marker in body:
                  print(f"Already patched: {path}: {marker}")
                  return
              count = body.count(anchor)
              if count != 1:
                  raise SystemExit(
                      f"{path}: expected one anchor in {marker}; found {count}."
                  )
              updated = body.replace(anchor, block if replace else block + anchor, 1)
              write(path, text[:body_start] + updated + text[closing:])
              print(f"Patched: {path}: {marker}")

          stat_declarations = """#ifdef CONFIG_KSU_MANUAL_HOOK
          __attribute__((hot))
          extern int ksu_handle_stat(int *dfd,
                  const char __user **filename_user, int *flags);
          extern void ksu_handle_newfstat_ret(unsigned int *fd,
                  struct stat __user **statbuf_ptr);
          #if defined(__ARCH_WANT_STAT64) || defined(__ARCH_WANT_COMPAT_STAT64)
          extern void ksu_handle_fstat64_ret(unsigned long *fd,
                  struct stat64 __user **statbuf_ptr);
          #endif
          #endif

          """
          insert_before(
              "fs/stat.c",
              "#if !defined(__ARCH_WANT_STAT64) || defined(__ARCH_WANT_SYS_NEWFSTATAT)",
              stat_declarations,
              "ksu_handle_stat(int *dfd",
          )
          patch_function(
              "fs/stat.c", r"SYSCALL_DEFINE4\(newfstatat,.*?\)\s*\{",
              "\terror = vfs_fstatat(dfd, filename, &stat, flag);",
              "#ifdef CONFIG_KSU_MANUAL_HOOK\n\tksu_handle_stat(&dfd, &filename, &flag);\n#endif\n",
              "ksu_handle_stat(&dfd",
          )
          patch_function(
              "fs/stat.c", r"SYSCALL_DEFINE2\(newfstat,.*?\)\s*\{",
              "\treturn error;",
              "#ifdef CONFIG_KSU_MANUAL_HOOK\n\tksu_handle_newfstat_ret(&fd, &statbuf);\n#endif\n",
              "ksu_handle_newfstat_ret(",
          )
          patch_function(
              "fs/stat.c", r"SYSCALL_DEFINE2\(fstat64,.*?\)\s*\{",
              "\treturn error;",
              "#ifdef CONFIG_KSU_MANUAL_HOOK\n\tksu_handle_fstat64_ret(&fd, &statbuf);\n#endif\n",
              "ksu_handle_fstat64_ret(", optional=True,
          )
          patch_function(
              "fs/stat.c", r"SYSCALL_DEFINE4\(fstatat64,.*?\)\s*\{",
              "\terror = vfs_fstatat(dfd, filename, &stat, flag);",
              "#ifdef CONFIG_KSU_MANUAL_HOOK\n\tksu_handle_stat(&dfd, &filename, &flag);\n#endif\n",
              "ksu_handle_stat(&dfd", optional=True,
          )

          exec_declarations = """#ifdef CONFIG_KSU_MANUAL_HOOK
          __attribute__((hot))
          extern int ksu_handle_execveat(int *fd,
                  struct filename **filename_ptr,
                  void *argv, void *envp, int *flags);
          __attribute__((hot))
          extern int ksu_handle_post_execveat(int *fd,
                  struct filename **filename_ptr,
                  void *argv, void *envp, int *flags, int *retval);
          #endif

          """
          insert_before(
              "fs/exec.c", "static int do_execveat_common(",
              exec_declarations, "ksu_handle_execveat(int *fd",
          )
          patch_function(
              "fs/exec.c", r"static int do_execveat_common\(.*?\)\s*\{",
              "\treturn __do_execve_file(fd, filename, argv, envp, flags, NULL);",
              "#ifdef CONFIG_KSU_MANUAL_HOOK\n"
              "\tint retval;\n"
              "\tksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);\n"
              "\tretval = __do_execve_file(fd, filename, argv, envp, flags, NULL);\n"
              "\tksu_handle_post_execveat(&fd, &filename, &argv, &envp, &flags, &retval);\n"
              "\treturn retval;\n"
              "#else\n"
              "\treturn __do_execve_file(fd, filename, argv, envp, flags, NULL);\n"
              "#endif",
              "ksu_handle_execveat(&fd", replace=True,
          )

          faccessat_declarations = """#ifdef CONFIG_KSU_MANUAL_HOOK
          __attribute__((hot))
          extern int ksu_handle_faccessat(int *dfd,
                  const char __user **filename_user, int *mode, int *flags);
          #endif

          """
          insert_before(
              "fs/open.c", "SYSCALL_DEFINE3(faccessat,",
              faccessat_declarations, "ksu_handle_faccessat(int *dfd",
          )
          patch_function(
              "fs/open.c", r"SYSCALL_DEFINE3\(faccessat,.*?\)\s*\{",
              "\treturn do_faccessat(dfd, filename, mode);",
              "#ifdef CONFIG_KSU_MANUAL_HOOK\n"
              "\tksu_handle_faccessat(&dfd, &filename, &mode, NULL);\n"
              "#endif\n",
              "ksu_handle_faccessat(&dfd",
          )

          reboot_declarations = """#ifdef CONFIG_KSU_MANUAL_HOOK
          extern int ksu_handle_sys_reboot(int magic1, int magic2,
                  unsigned int cmd, void __user **arg);
          #endif

          """
          insert_before(
              "kernel/reboot.c", "SYSCALL_DEFINE4(reboot,",
              reboot_declarations, "ksu_handle_sys_reboot(int magic1",
          )
          patch_function(
              "kernel/reboot.c", r"SYSCALL_DEFINE4\(reboot,.*?\)\s*\{",
              "\tif (!ns_capable(pid_ns->user_ns, CAP_SYS_BOOT))",
              "#ifdef CONFIG_KSU_MANUAL_HOOK\n"
              "\tksu_handle_sys_reboot(magic1, magic2, cmd, &arg);\n"
              "#endif\n",
              "ksu_handle_sys_reboot(magic1",
          )
          print("Manual hook edits completed.")
          PY

      - name: Configure and build kernel
        shell: bash
        working-directory: kernel-source
        run: |
          set -euo pipefail

          MAKE_ARGS=(
            O=out ARCH=arm64
            HOSTCC=gcc HOSTCXX=g++ HOSTLD=ld
            CC="ccache $CLANG_BIN/clang" LD="$CLANG_BIN/ld.lld"
            AR=llvm-ar NM=llvm-nm
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          )

          rm -f localversion*
          printf -- '-g%s\n' "$(git rev-parse --short HEAD)" > .scmversion

          echo "::group::Configure (${DEFCONFIG})"
          make "${MAKE_ARGS[@]}" "$DEFCONFIG"

          scripts/config --file out/.config \
            --enable KSU \
            --enable KSU_MANUAL_HOOK \
            --enable KSU_MANUAL_HOOK_AUTO_SETUID_HOOK \
            --enable KSU_MANUAL_HOOK_AUTO_INITRC_HOOK \
            --enable KSU_MANUAL_HOOK_AUTO_INPUT_HOOK \
            --enable KALLSYMS \
            --enable KALLSYMS_ALL \
            --enable LOCALVERSION_AUTO \
            --set-str LOCALVERSION "-${KERNEL_NAME}"

          make "${MAKE_ARGS[@]}" olddefconfig

          for option in KSU KSU_MANUAL_HOOK KSU_MANUAL_HOOK_AUTO_SETUID_HOOK \
                        KSU_MANUAL_HOOK_AUTO_INITRC_HOOK KSU_MANUAL_HOOK_AUTO_INPUT_HOOK \
                        KALLSYMS_ALL LOCALVERSION_AUTO; do
            if ! grep -qx "CONFIG_${option}=y" out/.config; then
              echo "::error::CONFIG_${option}=y is missing"
              exit 1
            fi
          done
          if ! grep -qxF "CONFIG_LOCALVERSION=\"-${KERNEL_NAME}\"" out/.config; then
            echo "::error::CONFIG_LOCALVERSION was not applied"
            exit 1
          fi
          echo "::endgroup::"

          echo "::group::Build Image.gz-dtb (-j${JOBS})"
          ccache --zero-stats > /dev/null
          make -j"$JOBS" "${MAKE_ARGS[@]}" Image.gz-dtb
          echo "::endgroup::"

          ccache --show-stats || true
          test -s out/arch/arm64/boot/Image.gz-dtb

          RELEASE="$(cat out/include/config/kernel.release)"
          echo "Kernel release: ${RELEASE}"
          case "$RELEASE" in
            *"-${KERNEL_NAME}-g"*) ;;
            *) echo "::warning::Unexpected kernel release string: ${RELEASE}" ;;
          esac

      - name: Save ccache
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.ccache.outputs.cache-primary-key }}

      - name: Package flashable zip
        shell: bash
        run: |
          set -euo pipefail

          cp kernel-source/out/arch/arm64/boot/Image.gz-dtb anykernel3/Image.gz-dtb

          cat > anykernel3/anykernel.sh <<'AK3'
          #!/sbin/sh

          properties() { '
          kernel.string=@KERNEL_NAME@
          do.devicecheck=0
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=
          device.name2=
          device.name3=
          device.name4=
          device.name5=
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }

          block=boot;
          is_slot_device=1;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;

          . tools/ak3-core.sh;

          ui_print "@KERNEL_NAME@ installer"
          ui_print "Build: @BUILD_DATE@"
          ui_print "Device check: disabled"

          dump_boot;
          write_boot;
          AK3

          sed -i \
            -e "s|@KERNEL_NAME@|${KERNEL_NAME}|g" \
            -e "s|@DEVICE_CODENAME@|${DEVICE_CODENAME}|g" \
            -e "s|@BUILD_DATE@|${BUILD_DATE}|g" \
            anykernel3/anykernel.sh
          chmod 0755 anykernel3/anykernel.sh

          (cd anykernel3 && zip -qr9 "$GITHUB_WORKSPACE/$ZIP_NAME" . -x '.git*' 'README.md')

          unzip -tq "$ZIP_NAME"
          LISTING="$(unzip -Z1 "$ZIP_NAME")"
          for entry in anykernel.sh tools/ak3-core.sh Image.gz-dtb \
                       META-INF/com/google/android/update-binary; do
            if ! grep -qxF "$entry" <<< "$LISTING"; then
              echo "::error::Missing from zip: $entry"
              exit 1
            fi
          done
          unzip -p "$ZIP_NAME" anykernel.sh | grep -qF "kernel.string=${KERNEL_NAME}"

          ls -lh "$ZIP_NAME"

      - name: Upload flashable zip
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.ZIP_NAME }}
          archive: false
          if-no-files-found: error
